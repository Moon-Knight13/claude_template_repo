# Which optional template subsystems this repository uses.
#
# The template ships several subsystems that not every derived repository wants.
# Turning one off here makes `scripts/validate-template.sh` stop requiring its
# files and makes the devcontainer skip installing it, so a derivative can
# delete what it does not use without going red in CI.
#
# This file is owned by each derived repository. It is listed in
# .templatesyncignore, so template-sync never overwrites your choices.
#
# Format: shell `key=value`, sourced by scripts/lib/subsystems.sh. Values are
# `true` or `false`. Everything defaults to `true`, so existing derivatives keep
# working unchanged after this file appears.
#
# Turning a subsystem OFF does not delete anything. It only stops the template
# from requiring it. Delete the files yourself once the switch is off.

# Local-model delegation: route low-risk work to a local Ollama endpoint.
# Off means the repo always uses Claude. Requires an Ollama endpoint to be
# useful — check .ai/route-log.jsonl; if every entry reads
# `local_unreachable_fallback`, the subsystem has never actually run.
# Files: scripts/route-model.sh, scripts/ask-local.sh, scripts/suggest-route.sh,
#        scripts/local-health.sh, scripts/delegate-local.sh,
#        docs/AI_ROUTING_POLICY.md, .claude/commands/route-task.md,
#        .claude/agents/local-worker.md
SUBSYSTEM_ROUTING=true

# GitHub Project board workflow: /next-issue, /run-epic, board.sh.
# Files: scripts/board.sh, scripts/bootstrap-project.sh,
#        scripts/suggest-route.sh, docs/KANBAN_WORKFLOW.md,
#        .claude/commands/{next-issue,run-epic}.md,
#        .github/ISSUE_TEMPLATE/{epic,user-story}.yml
SUBSYSTEM_BOARD=true

# BMAD planning skill pack, installed into .claude/skills/ at container start.
# Note the cost is context, not disk: the skill descriptions are loaded into the
# system prompt of every session in the repository. Turn off if _bmad-output/ is
# empty, i.e. nothing has ever been produced with it.
# Files: scripts/install-bmad.sh, scripts/bootstrap-bmad.sh,
#        docs/BMAD_WORKFLOW.md, .claude/commands/{bmad,bmad-to-board}.md
SUBSYSTEM_BMAD=true

# Caveman response-style plugin.
# Files: scripts/install-caveman.sh
SUBSYSTEM_CAVEMAN=true

# Day-0 provisioning: repo settings, rulesets, board creation, CODEOWNERS fill.
# Mostly one-shot; safe to turn off once .ai/bootstrap-completed exists and you
# do not expect to re-provision.
# Files: scripts/setup-day0.sh, scripts/check-day0.sh,
#        scripts/bootstrap-github-settings.sh, scripts/bootstrap-project.sh,
#        .claude/commands/day0-check.md
SUBSYSTEM_DAY0=true
