# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    # Pin the devcontainer base to its current LTS major (Node 24). Take digest
    # and minor/patch bumps automatically, but defer major-version jumps (e.g. to
    # the next LTS, or to a short-lived "Current" release) to manual review.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
# Language-specific managers are OFF by default, and must stay that way.
#
# Dependabot does not skip an ecosystem whose manifest is missing — it aborts
# the job with "/package.json not found" and reports a failed run. Neither this
# template nor any repo derived from it carries a root package.json or
# requirements.txt, so leaving pip and npm enabled here produced two failed runs
# a week, in every repo in the fleet, watching nothing.
#
# Enable one only in the derived repo, once that repo really has the manifest,
# and point `directory` at the folder holding it — which is usually not "/".
#
#   - package-ecosystem: "npm"
#     directory: "/scripts/content"     # the folder with package.json in it
#     schedule:
#       interval: "weekly"
#
#   - package-ecosystem: "pip"
#     directory: "/"                    # the folder with requirements.txt in it
#     schedule:
#       interval: "weekly"
